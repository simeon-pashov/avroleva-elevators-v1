# Avroleva Elevators v1 - host nginx location blocks for the path prefix /avroleva/elevators-v1/
# (VPS-GUIDE "routing rules"). /avroleva/ is the brand root: it will host the landing page, and
# sibling products live next to this one (/avroleva/elevators-v2/, ...), so nothing here may
# claim more than /avroleva/elevators-v1/.
#
# HOW TO INSTALL (VPS, as root):
#   cp /etc/nginx/sites-available/apps.conf /etc/nginx/sites-available/apps.conf.bak-$(date +%Y%m%d%H%M%S)
#   cp /var/www/avroleva/deploy/nginx-avroleva.conf /etc/nginx/snippets/avroleva.conf
#   # then, inside the EXISTING `server { ... listen 443 ssl ... }` block of apps.conf, after the
#   # last app location and BEFORE the certbot-managed `listen 443 ssl` lines, add one line:
#   #     include /etc/nginx/snippets/avroleva.conf;
#   nginx -t && systemctl reload nginx
#
# Do not put these blocks in the port-80 server: COOKIE_SECURE=true needs X-Forwarded-Proto: https
# or the login answers 200 without a Set-Cookie. No certbot work is needed for a new path.
#
# The app runs as if at "/": nginx strips the prefix (trailing slash on proxy_pass), both SPAs are
# built with VITE_BASE=/avroleva/elevators-v1/, the API is reached as
# /avroleva/elevators-v1/api/v1/..., the session cookie path is "/". No websockets.

# TEMPORARY - remove when the brand landing page lands at /avroleva/. Until then the bare brand
# path (links and QR labels printed before the move to /avroleva/elevators-v1/) lands on this
# product. Exact matches only: nothing broader than these two paths is redirected.
location = /avroleva  { return 302 /avroleva/; }
location = /avroleva/ { return 302 /avroleva/elevators-v1/; }

location = /avroleva/elevators-v1      { return 302 /avroleva/elevators-v1/; }
location = /avroleva/elevators-v1/tech { return 302 /avroleva/elevators-v1/tech/; }

# Hashed, immutable build assets of the office SPA and of the technician PWA. Long cache here;
# everything else (index.html, sw.js, manifest, API) stays no-cache from the app.
location /avroleva/elevators-v1/assets/ {
    proxy_pass http://127.0.0.1:3005/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /avroleva/elevators-v1/tech/assets/ {
    proxy_pass http://127.0.0.1:3005/tech/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Everything else: office SPA, /tech/ PWA, /api/v1/, /print/, /p/ (public QR page), /s/ (statement
# page), /downloads/ (APK install page), /files/ (signed).
location /avroleva/elevators-v1/ {
    proxy_pass http://127.0.0.1:3005/;      # trailing slash = strip /avroleva/elevators-v1/
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25M;               # photo uploads (global default is 15M)
    proxy_read_timeout   120s;              # CSV streams, full export requests, report generation
    proxy_send_timeout   120s;
}
