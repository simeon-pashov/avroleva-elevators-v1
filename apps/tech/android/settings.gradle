// Capacitor 7.6 modules compile with Java 21 (sourceCompatibility 21). The Gradle JVM is JDK 17
// (ANDROID-TOOLCHAIN.md); this resolver lets Gradle download a matching JDK 21 toolchain into
// ~/.gradle/jdks on the first build instead of failing with "Cannot find a Java installation".
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'