# Local development database ONLY (the API and office run on the host with `npm run dev`).
# By convention on this PC every project has its own postgres container on its own host port.
# Avroleva Elevators reuses the Uncle CRM dev container (unclecrm-db, port 5432) when it is running;
# otherwise start this one and point DATABASE_URL at 127.0.0.1:5436.
services:
  db:
    image: postgres:16-alpine
    container_name: avroleva-db
    environment:
      POSTGRES_USER: avroleva
      POSTGRES_PASSWORD: avroleva_dev
      POSTGRES_DB: avroleva
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avroleva -d avroleva"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
